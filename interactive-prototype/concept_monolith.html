<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delphantic - Concept 3: Monolith</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000000; font-family: 'Georgia', serif; }
        
        .scene {
            width: 100vw;
            height: 100vh;
            perspective: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0D2137 0%, #000000 60%);
        }

        .monolith {
            width: 300px;
            height: 500px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateSlow 30s linear infinite;
        }

        /* 6 faces of the Hexagonal Prism */
        .face {
            position: absolute;
            width: 150px; /* Side width */
            height: 500px;
            left: 75px;
            background: rgba(13, 33, 55, 0.7); /* Deep Sea Glass */
            border: 1px solid rgba(42, 171, 181, 0.4); /* Turkuaz edges */
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Reflections */
        .face::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(245, 237, 216, 0.2) 0%, transparent 40%, transparent 60%, rgba(42, 171, 181, 0.1) 100%);
            pointer-events: none;
        }

        /* Positioning the 6 faces (radius = width / (2 * tan(30deg)) = 150 / 1.154 = ~130px) */
        .face:nth-child(1) { transform: rotateY(0deg) translateZ(130px); }
        .face:nth-child(2) { transform: rotateY(60deg) translateZ(130px); }
        .face:nth-child(3) { transform: rotateY(120deg) translateZ(130px); }
        .face:nth-child(4) { transform: rotateY(180deg) translateZ(130px); }
        .face:nth-child(5) { transform: rotateY(240deg) translateZ(130px); }
        .face:nth-child(6) { transform: rotateY(300deg) translateZ(130px); }

        @keyframes rotateSlow {
            from { transform: rotateY(0deg) rotateX(10deg); }
            to { transform: rotateY(360deg) rotateX(10deg); }
        }

        .content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 2; text-align: center; color: #F5EDD8; pointer-events: none;
        }
        h1 { font-size: 4rem; letter-spacing: 0.15em; font-weight: 400; text-shadow: 0 10px 30px rgba(0,0,0,0.8); margin: 0; }
        p { font-family: monospace; letter-spacing: 0.3em; color: #C4A882; margin-top: 10px; }
        .tag { position: absolute; top: 30px; left: 30px; font-family: monospace; color: rgba(255,255,255,0.3); z-index: 2; letter-spacing: 0.2em; }
    </style>
</head>
<body>
    <div class="tag">CONCEPT 3: THE MONOLITH</div>
    <div class="scene">
        <div class="monolith">
            <div class="face"></div>
            <div class="face"></div>
            <div class="face"></div>
            <div class="face"></div>
            <div class="face"></div>
            <div class="face"></div>
        </div>
    </div>
    <div class="content">
        <h1>DELPHANTIC</h1>
        <p>ABSOLUTE STRUCTURE</p>
    </div>
</body>
</html>
